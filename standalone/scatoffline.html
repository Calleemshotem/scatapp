<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SCAT — Portable Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-[#000000] text-white font-sans overflow-hidden">
  <div class="flex h-screen">
    <aside class="w-72 shrink-0 bg-[#000000] border-r border-white/10 px-6 py-8 flex flex-col gap-10">
      <div>
        <h1 class="text-2xl font-bold tracking-[0.15em] uppercase">SCAT</h1>
        <p class="mt-2 text-sm text-slate-400">Portable player</p>
      </div>
      <nav class="space-y-2">
        <button class="w-full rounded-2xl px-4 py-3 text-left text-sm font-semibold text-slate-100 bg-white/5 hover:bg-white/10 transition">Home</button>
        <button class="w-full rounded-2xl px-4 py-3 text-left text-sm font-semibold text-slate-100 hover:bg-white/10 transition">Search</button>
        <button class="w-full rounded-2xl px-4 py-3 text-left text-sm font-semibold text-slate-100 hover:bg-white/10 transition">Your Library</button>
      </nav>
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <p class="text-xs uppercase tracking-[0.3em] text-slate-500">Playlists</p>
          <button id="newPlaylistBtn" class="rounded-full bg-white/5 px-3 py-1 text-sm text-slate-100 hover:bg-white/10 transition">+</button>
        </div>
        <div id="playlistList" class="space-y-2"></div>
      </div>
      <div class="mt-auto text-xs uppercase tracking-[0.3em] text-slate-500">Local + Live Sync</div>
    </aside>

    <main class="flex-1 overflow-hidden">
      <div class="h-full overflow-y-auto bg-gradient-to-b from-[#121212] to-[#000000] px-8 py-8">
        <section class="mb-8">
          <div class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <p class="text-sm uppercase tracking-[0.25em] text-slate-400">Now Playing</p>
              <h2 class="mt-3 text-3xl font-bold">Your portable studio</h2>
            </div>
            <div class="flex flex-col gap-3 sm:flex-row sm:items-center w-full">
              <label class="inline-flex items-center rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-slate-100 hover:bg-white/10 transition cursor-pointer">
                Select MP3 files
                <input id="fileInput" type="file" accept="audio/*" multiple class="sr-only" />
              </label>
              <input id="searchInput" type="text" placeholder="Search songs or artists" class="w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:border-[#1DB954]" />
              <div class="text-sm text-slate-400" id="selectedCount">No files selected</div>
            </div>
          </div>
        </section>

        <section class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
          <div class="rounded-3xl border border-white/10 bg-white/5 p-6 shadow-[0_20px_50px_rgba(0,0,0,0.45)]">
            <h3 class="text-lg font-semibold mb-4">Live songs</h3>
            <div id="playlist" class="space-y-4"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <footer class="fixed bottom-0 left-72 right-0 border-t border-white/10 bg-[#121212]/95 backdrop-blur-xl px-6 py-4">
    <div class="flex items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="h-14 w-14 rounded-2xl bg-white/10"></div>
        <div>
          <div id="now" class="text-sm font-semibold">No track</div>
          <div class="text-xs text-slate-400">Ready to play</div>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <button id="prev" class="rounded-full bg-white/5 p-3 text-slate-200 hover:bg-white/10 transition">◀◀</button>
        <button id="play" class="rounded-full bg-[#1DB954] p-4 text-black shadow-[0_15px_30px_rgba(29,185,84,0.35)] transition hover:scale-[1.03]">▶</button>
        <button id="next" class="rounded-full bg-white/5 p-3 text-slate-200 hover:bg-white/10 transition">▶▶</button>
      </div>

      <div class="flex items-center gap-4 text-sm text-slate-400">
        <button class="rounded-full bg-white/5 px-3 py-2 hover:bg-white/10 transition">Queue</button>
        <input id="seek" type="range" min="0" max="0" value="0" class="h-1 w-48 cursor-pointer appearance-none rounded-full bg-slate-600 accent-[#1DB954]" />
        <input id="repeat" type="checkbox" class="hidden" />
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
